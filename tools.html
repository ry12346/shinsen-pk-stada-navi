<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<meta content="#1f3443" name="theme-color"/>
<title>スタダ ツール集</title>
<meta content="自爆部隊速度計算機と資源必要量トラッカー。PKシーズン スタダナビゲーションの補助ツールです。" name="description"/>
<style>
:root{--paper:#f6f3ed;--surface:#fff;--ink:#202a30;--muted:#68747b;--navy:#1f3443;--navy2:#29495d;--gold:#b38a45;--gold-soft:#f1e8d7;--line:#dde2df;--warn:#9c443b;--warn-bg:#fff4f1;--ok:#3c6a56;--ok-bg:#eff7f3;--shadow:0 12px 30px rgba(24,39,48,.08)}
*{box-sizing:border-box;min-width:0}
html{overflow-x:hidden}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;line-height:1.7;-webkit-text-size-adjust:100%}
a{color:inherit}
button,input,select{font:inherit}
.topbar{position:sticky;top:0;z-index:20;background:rgba(31,52,67,.97);color:#fff;padding-top:env(safe-area-inset-top);box-shadow:0 2px 14px rgba(0,0,0,.15)}
.topbar-inner{max-width:820px;margin:auto;height:60px;padding:0 16px;display:flex;align-items:center;gap:12px}
.back-link{color:#fff;text-decoration:none;font-size:13px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.topbar-title{font-weight:900;font-size:15px;flex:1}
.layout{max-width:820px;margin:auto;padding:20px 14px 80px}
.tool-picker{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.tool-tab{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 8px;font-weight:800;color:var(--ink);cursor:pointer;font-size:13px}
.tool-tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.tool-panel{display:none}
.tool-panel.active{display:block}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 7px 22px rgba(28,42,49,.045);margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 6px}
.card h3{font-size:14px;margin:16px 0 8px;padding-left:9px;border-left:3px solid var(--gold)}
.card p.note{font-size:12px;color:var(--muted);margin:2px 0 10px}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field input:not([type=checkbox]),.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:14px;background:#fff}
.checkbox-label{display:flex!important;align-items:center;gap:6px;font-size:13px!important;color:var(--ink)!important}
.checkbox-label input{width:auto;flex:none;margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;font-size:13px;cursor:pointer}
.btn-primary{background:var(--navy);color:#fff}
.btn-outline{background:#fff;border:1px solid var(--line);color:var(--ink)}
.slot{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:#fbfbf9}
.slot h4{margin:0 0 8px;font-size:13px;color:var(--navy2)}
.slot-result{margin-top:8px;font-size:13px;font-weight:800;padding:8px 10px;border-radius:10px}
.slot-result.hit{background:var(--ok-bg);color:var(--ok)}
.slot-result.miss{background:var(--warn-bg);color:var(--warn)}
.custom-bonus,.custom-num{margin-top:6px}
.result-box{margin-top:14px;border-radius:14px;padding:14px;font-size:14px;line-height:1.7}
.result-box.ok{background:var(--ok-bg);color:var(--ok)}
.result-box.warn{background:var(--warn-bg);color:var(--warn)}
.result-box.info{background:var(--gold-soft);color:#7e6234}
.result-box strong{font-size:16px}
.summary-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}
.summary-table th,.summary-table td{border:1px solid var(--line);padding:6px 8px;text-align:left}
.summary-table th{background:#eef1ef}
</style>
</head>
<body>
<header class="topbar">
<div class="topbar-inner">
<a class="back-link" href="index.html">&larr; ガイドへ</a>
<div class="topbar-title">スタダ ツール集</div>
</div>
</header>
<div class="layout">

<div class="tool-picker" role="tablist">
<button aria-selected="true" class="tool-tab active" data-tool="speed" role="tab">自爆部隊速度計算機</button>
<button aria-selected="false" class="tool-tab" data-tool="tracker" role="tab">資源必要量トラッカー</button>
</div>

<!-- ===== 速度計算機 ===== -->
<div class="tool-panel active" id="panel-speed">

<div class="card">
<h2>速度比較（自動計算）</h2>
<p class="note">武将・レベル・凸・戦法を選ぶと、登録済みの守備軍大将（Lv4/Lv5土地攻略）と自動で比較します。<br/>武将・戦法・敵大将のデータの追加・変更は作者へ連絡してください。</p>
<div id="slots"></div>
<div id="speedResult"></div>
</div>

</div>

<!-- ===== 資源トラッカー ===== -->
<div class="tool-panel" id="panel-tracker">

<div class="card">
<h2>資源必要量トラッカー</h2>
<p class="note">対応は天守6以降です。</p>

<h3>目標</h3>
<div class="field"><label>目標の天守レベル</label>
<select id="targetCastle">
<option value="19.2">天守6（必要 19.2万）</option>
<option value="29.2">天守7（必要 29.2万）</option>
<option value="58.4">天守8（必要 58.4万）</option>
<option value="custom">その他（手入力）</option>
</select>
<input class="custom-num" id="targetCastleCustom" placeholder="必要資源量（万）" style="display:none" type="number"/>
</div>

<h3>蔵</h3>
<div class="field"><label>蔵レベル</label>
<select id="storageCastle">
<option value="16">蔵Lv6（上限 16万）</option>
<option value="21">蔵Lv7（上限 21万）</option>
<option value="26">蔵Lv8（上限 26万）</option>
<option value="31">蔵Lv9（上限 31万）</option>
<option value="36">蔵Lv10（上限 36万）</option>
<option value="46">蔵Lv11（上限 46万）</option>
<option value="56">蔵Lv12（上限 56万）</option>
<option value="custom">その他（手入力）</option>
</select>
<input class="custom-num" id="storageCastleCustom" placeholder="蔵の上限（万）" style="display:none" type="number"/>
</div>

<h3>報酬</h3>
<div class="field"><label>評定報酬・任務報酬など（蔵の上限を超えて受け取れる資源、万）</label><input id="rewardAmount" placeholder="例: 5" step="0.1" type="number"/></div>

<h3>今の状況</h3>
<div class="row2">
<div class="field"><label>現在の貯蓄量（万）</label><input id="currentStock" placeholder="例: 10" step="0.1" type="number"/></div>
<div class="field"><label>毎時の産出量（万/時）</label><input id="hourlyRate" placeholder="例: 1.2" step="0.01" type="number"/></div>
</div>
<div class="field"><label>徴発する土地</label>
<select id="levyLand">
<option value="1.2">Lv4土地（1回 1.2万）</option>
<option value="2.4">Lv5土地（1回 2.4万）</option>
<option value="3.6">Lv6土地（1回 3.6万）</option>
</select>
</div>
<div class="field"><label class="checkbox-label"><input id="levyBoost" type="checkbox"/> 徴発促進策を使用する（徴発の資源獲得量+15%）</label></div>

<h3>労力</h3>
<div class="row2">
<div class="field"><label>現在の労力</label><input id="currentLabor" max="50" min="0" placeholder="0" type="number"/></div>
<div class="field"><label>現在時刻</label><input id="nowTime" type="datetime-local"/></div>
</div>
<div class="field"><label class="checkbox-label"><input id="dailyLaborBuy" type="checkbox"/> 200小判で労力+20を購入する（この計算に含める）</label></div>

<button class="btn btn-primary" id="calcTracker" type="button">徴発パターンを計算する</button>
<div id="trackerResult"></div>
</div>

</div>

</div>

<script>
// ---------- tool tab switching ----------
document.querySelectorAll('.tool-tab').forEach(btn=>btn.addEventListener('click',()=>{
 document.querySelectorAll('.tool-tab').forEach(b=>{b.classList.remove('active');b.setAttribute('aria-selected','false')});
 document.querySelectorAll('.tool-panel').forEach(p=>p.classList.remove('active'));
 btn.classList.add('active');btn.setAttribute('aria-selected','true');
 document.getElementById('panel-'+btn.dataset.tool).classList.add('active');
 try{localStorage.setItem('stada-tools-lasttab', btn.dataset.tool)}catch(e){}
}));
(function(){
 try{
  const last = localStorage.getItem('stada-tools-lasttab');
  if(last){ const b = document.querySelector('.tool-tab[data-tool="'+last+'"]'); if(b) b.click(); }
 }catch(e){}
})();

// ================= 速度計算機 =================
// 共通データ。data/generals.csv, data/tactics.csv, data/enemy_generals.csv を編集すると更新されます。
let BUILTIN_GENERALS = [];
let BUILTIN_TACTICS = [];
let BUILTIN_ENEMIES = [];

function parseCSV(text){
 const lines = text.replace(/^﻿/,'').trim().split(/\r?\n/).filter(l=>l.trim()!=='');
 if(lines.length<2) return [];
 const headers = lines[0].split(',').map(h=>h.trim());
 return lines.slice(1).map(line=>{
  const cells = line.split(',').map(c=>c.trim());
  const obj = {};
  headers.forEach((h,i)=>{ obj[h] = cells[i]!==undefined ? cells[i] : ''; });
  return obj;
 });
}
async function loadBuiltinData(){
 try{
  const res = await fetch('data/generals.csv');
  const rows = parseCSV(await res.text());
  BUILTIN_GENERALS = rows.filter(r=>r.name).map(r=>({
   name:r.name, lv1Speed:Number(r.lv1Speed||0), increment:Number(r.increment||0)
  }));
 }catch(e){ BUILTIN_GENERALS = []; }
 try{
  const res = await fetch('data/tactics.csv');
  const rows = parseCSV(await res.text());
  BUILTIN_TACTICS = rows.filter(r=>r.name).map(r=>({ name:r.name, bonus:Number(r.bonus||0) }));
 }catch(e){ BUILTIN_TACTICS = []; }
 try{
  const res = await fetch('data/enemy_generals.csv');
  const rows = parseCSV(await res.text());
  BUILTIN_ENEMIES = rows.filter(r=>r.name).map(r=>({ name:r.name, maxSpeed:Number(r.maxSpeed||0), landLevel:r.landLevel||'' }));
 }catch(e){ BUILTIN_ENEMIES = []; }
 renderSlots();
}

const DUPE_SPEED_BONUS = 10; // 凸1につき速度+10（全ポイントを速度に振った想定）

function computeSpeed(gen, targetLevel, dupe){
 return gen.lv1Speed + (targetLevel - 1) * (gen.increment || 0) + (dupe||0) * DUPE_SPEED_BONUS;
}

function bonusSelectHTML(prefix){
 let opts = '<option value="">戦法なし</option>';
 BUILTIN_TACTICS.forEach((t,ti)=>{ opts += '<option value="'+ti+'">'+t.name+' (+'+t.bonus+')</option>'; });
 opts += '<option value="custom">カスタム入力…</option>';
 return '<select class="bonusSelect" data-slotprefix="'+prefix+'">'+opts+'</select><input class="custom-bonus" data-slotprefix="'+prefix+'" placeholder="速度ボーナス" style="display:none" type="number"/>';
}
function levelSelectHTML(prefix, defaultLevel){
 const opts = [7,8,9];
 let html = '<select class="levelSelect" data-slotprefix="'+prefix+'">';
 opts.forEach(l=>{ html += '<option value="'+l+'"'+(l===defaultLevel?' selected':'')+'>Lv'+l+'</option>'; });
 html += '<option value="custom"'+(opts.indexOf(defaultLevel)===-1?' selected':'')+'>カスタム…</option></select>';
 html += '<input class="custom-num levelCustom" data-slotprefix="'+prefix+'" placeholder="レベル" style="display:'+(opts.indexOf(defaultLevel)===-1?'block':'none')+'" type="number" value="'+(opts.indexOf(defaultLevel)===-1?defaultLevel:'')+'"/>';
 return html;
}
function dupeSelectHTML(prefix){
 let html = '<select class="dupeSelect" data-slotprefix="'+prefix+'">';
 for(let d=0; d<=5; d++){ html += '<option value="'+d+'"'+(d===0?' selected':'')+'>'+d+'凸</option>'; }
 html += '</select>';
 return html;
}
function buildSlot(label, i){
 const slot = document.createElement('div'); slot.className='slot'; slot.dataset.slot=i;
 let genOpts = '<option value="">武将を選択</option>';
 BUILTIN_GENERALS.forEach((g,gi)=>{ genOpts += '<option value="'+gi+'">'+g.name+'（Lv1速度'+g.lv1Speed+(g.increment?' / +'+g.increment+'per Lv':'')+'）</option>'; });
 slot.innerHTML =
  '<h4>'+label+'</h4>'+
  '<div class="field"><select class="genSelect">'+genOpts+'</select></div>'+
  '<div class="row2"><div class="field"><label style="margin:0 0 4px">計算するレベル</label>'+levelSelectHTML(i+'-lv', 7)+'</div>'+
  '<div class="field"><label style="margin:0 0 4px">凸</label>'+dupeSelectHTML(i+'-dupe')+'</div></div>'+
  '<div class="field"><label style="margin:0 0 4px">戦法</label>'+bonusSelectHTML(i+'-tac')+'</div>';
 slot.querySelector('.bonusSelect').addEventListener('change',(e)=>{
  slot.querySelector('.custom-bonus').style.display = e.target.value==='custom' ? 'block' : 'none';
  recalcAll();
 });
 slot.querySelector('.levelSelect').addEventListener('change',(e)=>{
  slot.querySelector('.levelCustom').style.display = e.target.value==='custom' ? 'block' : 'none';
  recalcAll();
 });
 slot.querySelector('.genSelect').addEventListener('change', recalcAll);
 slot.querySelector('.dupeSelect').addEventListener('change', recalcAll);
 slot.querySelector('.levelCustom').addEventListener('input', recalcAll);
 slot.querySelector('.custom-bonus').addEventListener('input', recalcAll);
 return slot;
}
function renderSlots(){
 const wrap = document.getElementById('slots');
 wrap.innerHTML = '';
 wrap.appendChild(buildSlot('大将', 0));
 wrap.appendChild(buildSlot('副将1', 1));
 const addBtn = document.createElement('button');
 addBtn.type = 'button';
 addBtn.className = 'btn btn-outline';
 addBtn.style.width = '100%';
 addBtn.style.marginBottom = '10px';
 addBtn.textContent = '+ 副将2を使う';
 addBtn.addEventListener('click',()=>{
  wrap.insertBefore(buildSlot('副将2', 2), addBtn);
  addBtn.remove();
  recalcAll();
 });
 wrap.appendChild(addBtn);
 recalcAll();
}

function recalcAll(){
 const box = document.getElementById('speedResult');
 const labels = ['大将','副将1','副将2'];
 const rawSlots = [];
 document.querySelectorAll('#slots .slot').forEach((slot,i)=>{
  const genIdx = slot.querySelector('.genSelect').value;
  if(genIdx===''){ return; }
  const gen = BUILTIN_GENERALS[Number(genIdx)];
  if(!gen) return;
  const levelSel = slot.querySelector('.levelSelect');
  let targetLevel = 7;
  if(levelSel.value==='custom'){
   const custom = slot.querySelector('.levelCustom').value;
   if(custom!=='') targetLevel = Number(custom);
  }else{
   targetLevel = Number(levelSel.value);
  }
  const dupe = Number(slot.querySelector('.dupeSelect').value || 0);
  const base = computeSpeed(gen, targetLevel, dupe);
  const bonusSel = slot.querySelector('.bonusSelect');
  let bonus = 0;
  if(bonusSel.value==='custom'){
   bonus = Number(slot.querySelector('.custom-bonus').value || 0);
  }else if(bonusSel.value!==''){
   const t = BUILTIN_TACTICS[Number(bonusSel.value)];
   if(t) bonus = t.bonus;
  }
  rawSlots.push({label:labels[i], name:gen.name, level:targetLevel, dupe, base, bonus});
 });

 if(rawSlots.length===0){
  box.innerHTML = '<div class="result-box warn">武将を1体以上選んでください。</div>';
  return;
 }

 // 戦法は自軍全体の速度に効果があるため、誰が持っていても全員の速度に加算する
 const round2 = n => Math.round(n*100)/100;
 const armyBonus = round2(rawSlots.reduce((sum,s)=>sum+s.bonus, 0));
 const slotData = rawSlots.map(s=>({label:s.label, name:s.name, level:s.level, dupe:s.dupe, total:round2(s.base+armyBonus)}));

 let html = '<div class="result-box ok"><strong>あなたの武将の速度</strong>（戦法ボーナス合計 +'+armyBonus+' を全員に加算）<table class="summary-table"><tr><th>枠</th><th>武将</th><th>Lv/凸</th><th>合計速度</th></tr>';
 slotData.forEach(s=>{ html += '<tr><td>'+s.label+'</td><td>'+s.name+'</td><td>Lv'+s.level+' / '+s.dupe+'凸</td><td>'+s.total+'</td></tr>'; });
 html += '</table></div>';

 if(BUILTIN_ENEMIES.length===0){
  html += '<div class="result-box warn">敵大将データが未登録です。data/enemy_generals.csvに追加してください。</div>';
 }else{
  const groups = {};
  BUILTIN_ENEMIES.forEach(e=>{
   const key = e.landLevel || 'その他';
   if(!groups[key]) groups[key]=[];
   groups[key].push(e);
  });
  const groupKeys = Object.keys(groups).sort((a,b)=>{
   const na=Number(a), nb=Number(b);
   if(!isNaN(na) && !isNaN(nb)) return na-nb;
   return String(a).localeCompare(String(b));
  });
  groupKeys.forEach(key=>{
   const list = groups[key].slice().sort((a,b)=>a.maxSpeed-b.maxSpeed);
   const title = (key==='その他') ? '敵大将との比較' : 'Lv'+key+'土地攻略との比較';
   html += '<div class="result-box info"><strong>'+title+'</strong><table class="summary-table"><tr><th>守備軍大将</th><th>最大速度</th>';
   slotData.forEach(s=>{ html += '<th>'+s.label+'</th>'; });
   html += '</tr>';
   list.forEach(e=>{
    html += '<tr><td>'+e.name+'</td><td>'+e.maxSpeed+'</td>';
    slotData.forEach(s=>{
     const first = s.total > e.maxSpeed;
     html += '<td style="color:'+(first?'var(--ok)':'var(--warn)')+';font-weight:800">'+(first?'○ 先手':'× 後手')+'</td>';
    });
    html += '</tr>';
   });
   html += '</table></div>';
  });
 }

 box.innerHTML = html;
}

renderSlots();
loadBuiltinData();

// ================= 資源トラッカー =================
(function(){
 const now = new Date();
 now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
 document.getElementById('nowTime').value = now.toISOString().slice(0,16);
})();
['targetCastle','storageCastle'].forEach(id=>{
 document.getElementById(id).addEventListener('change',(e)=>{
  document.getElementById(id+'Custom').style.display = e.target.value==='custom' ? 'block' : 'none';
 });
});

const LABOR_PER_LEVY = 6; // 徴発1回の労力コスト（固定）
const LABOR_CAP = 50;
const DAILY_LABOR_BUY_AMOUNT = 20; // 200小判で1日1回、+20

function fmtDate(d){
 return (d.getMonth()+1)+'月'+d.getDate()+'日 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

document.getElementById('calcTracker').addEventListener('click',()=>{
 const targetSel = document.getElementById('targetCastle').value;
 const targetNeed = targetSel==='custom' ? Number(document.getElementById('targetCastleCustom').value||0) : Number(targetSel);
 const capSel = document.getElementById('storageCastle').value;
 const storageCap = capSel==='custom' ? Number(document.getElementById('storageCastleCustom').value||0) : Number(capSel);
 const currentStock = Number(document.getElementById('currentStock').value || 0);
 const rewardAmount = Number(document.getElementById('rewardAmount').value || 0);
 const hourlyRate = Number(document.getElementById('hourlyRate').value || 0);
 const levyBase = Number(document.getElementById('levyLand').value || 0);
 const levyBoost = document.getElementById('levyBoost').checked;
 const stonePerLevy = levyBoost ? levyBase * 1.15 : levyBase;
 const currentLabor = Number(document.getElementById('currentLabor').value || 0);
 const dailyLaborBuy = document.getElementById('dailyLaborBuy').checked;
 const nowVal = document.getElementById('nowTime').value;
 const box = document.getElementById('trackerResult');

 if(targetNeed<=0){ box.innerHTML = '<div class="result-box warn">目標の天守レベルを選んでください。</div>'; return; }
 const now = nowVal ? new Date(nowVal) : new Date();

 // 評定報酬・任務報酬などは蔵の上限を超えて受け取れるため、目標からそのぶんを差し引いた
 // 「蔵の中で貯める必要がある量」を実質の目標として扱う
 const effectiveTarget = Math.max(0, targetNeed - rewardAmount);
 const rewardNote = rewardAmount>0 ? '報酬'+rewardAmount+'万を含めて目標'+targetNeed+'万に到達するには、蔵内で'+effectiveTarget+'万まで貯める必要があります。' : '';

 if(storageCap>0 && effectiveTarget > storageCap){
  const gap = (effectiveTarget - storageCap).toFixed(2);
  box.innerHTML = '<div class="result-box warn"><strong>徴発と報酬だけでは目標に届きません</strong><br/>'
   +'蔵内で貯める必要がある量（'+effectiveTarget+'万）が蔵の上限（'+storageCap+'万）を超えています。'+(rewardNote?'<br/>'+rewardNote:'')+'<br/>'
   +'残り <strong>'+gap+'万</strong> は、さらに評定報酬や任務報酬など「上限を超えて受け取れる」報酬を追加で受け取る必要があります。</div>';
  return;
 }

 if(effectiveTarget<=0){
  box.innerHTML = '<div class="result-box ok"><strong>今すぐ天守レベルを上げられます</strong><br/>'
   +'報酬'+rewardAmount+'万だけで目標'+targetNeed+'万に到達しているため、徴発は不要です。</div>';
  return;
 }

 const round2 = n => Math.round(n*100)/100;
 const startLabor = Math.min(currentLabor + (dailyLaborBuy ? DAILY_LABOR_BUY_AMOUNT : 0), LABOR_CAP);

 // 徴発は蔵の上限を超えて受け取れないため、上限に達した時点でそれ以上の徴発は無駄になる。
 // 目標（蔵の上限以下）に届いた時点、または上限に達した時点で徴発を止めるものとして進める。
 let cappedNote = '';

 // 今すぐ使える労力ぶんの徴発を、目標に届くか蔵の上限に達するまで1回ずつ実行
 const maxImmediateLevies = Math.floor(startLabor / LABOR_PER_LEVY);
 let levies = 0;
 let stock = currentStock;
 while(levies < maxImmediateLevies && stock < effectiveTarget){
  const raw = stock + stonePerLevy;
  levies += 1;
  if(storageCap>0 && raw > storageCap){
   stock = storageCap;
   cappedNote = '蔵の上限（'+storageCap+'万）を超えるため、'+levies+'回目の徴発では一部の資源が受け取れません（それ以上の徴発は不要です）。';
   break;
  }
  stock = round2(raw);
 }
 const remainder = startLabor - levies*LABOR_PER_LEVY;

 let reachedAt = (stock >= effectiveTarget) ? now : null;
 let elapsedHours = 0;
 let hoursToNextLevy = (LABOR_PER_LEVY - remainder) * 0.5; // 労力回復は30分で1
 const MAX_ROWS = 12;

 for(let i=0; i<MAX_ROWS && reachedAt===null; i++){
  if(hourlyRate>0){
   const neededHours = (effectiveTarget - stock) / hourlyRate;
   if(neededHours <= hoursToNextLevy){
    elapsedHours += neededHours;
    reachedAt = new Date(now.getTime() + elapsedHours*3600*1000);
    break;
   }
  }
  elapsedHours += hoursToNextLevy;
  const raw = stock + hourlyRate*hoursToNextLevy + stonePerLevy;
  levies += 1;
  if(storageCap>0 && raw > storageCap){
   stock = storageCap;
   if(!cappedNote){ cappedNote = '蔵の上限（'+storageCap+'万）を超えるため、'+levies+'回目の徴発では一部の資源が受け取れません（それ以上の徴発は不要です）。'; }
  }else{
   stock = round2(raw);
  }
  if(stock>=effectiveTarget){ reachedAt = new Date(now.getTime() + elapsedHours*3600*1000); }
  hoursToNextLevy = 3; // 以降は労力6回復ごと＝3時間おきに徴発可能
 }

 const timeText = !reachedAt ? '未到達'
  : (reachedAt.getTime()===now.getTime() ? '今すぐ' : fmtDate(reachedAt)+'ごろ');
 const waitNote = (reachedAt && reachedAt.getTime()!==now.getTime())
  ? 'それまでは徴発と毎時の産出で資源が貯まるのを待つ必要があります。' : '';

 box.innerHTML = '<div class="result-box '+(reachedAt?'ok':'warn')+'"><strong>資源量の推移</strong>'
  +(rewardNote?'<p style="margin:6px 0 0;font-size:12px;color:var(--muted)">'+rewardNote+'</p>':'')
  +(cappedNote?'<p style="margin:6px 0 0;font-size:12px;color:var(--warn)">'+cappedNote+'</p>':'')
  +'<div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:12px">'
  +'<div style="flex:1;min-width:130px"><div style="font-size:11px;color:var(--muted)">必要な徴発回数</div><div style="font-size:24px;font-weight:900">'+levies+'回</div></div>'
  +'<div style="flex:1;min-width:130px"><div style="font-size:11px;color:var(--muted)">天守レベルを上げられる時刻</div><div style="font-size:20px;font-weight:900">'+timeText+'</div></div>'
  +'</div>'
  +(waitNote?'<p style="margin:10px 0 0;font-size:12px;color:var(--muted)">'+waitNote+'</p>':'')
  +(reachedAt ? '' : '<p style="margin:10px 0 0">この見込みの範囲内では到達しませんでした。毎時産出量や貯蓄量を見直してください。</p>')
  +'</div>';
});
</script>
</body>
</html>
