<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<meta content="#1f3443" name="theme-color"/>
<title>スタダ ツール集</title>
<meta content="自爆部隊速度計算機と資源必要量トラッカー。PKシーズン スタダナビゲーションの補助ツールです。" name="description"/>
<style>
:root{--paper:#f6f3ed;--surface:#fff;--ink:#202a30;--muted:#68747b;--navy:#1f3443;--navy2:#29495d;--gold:#b38a45;--gold-soft:#f1e8d7;--line:#dde2df;--warn:#9c443b;--warn-bg:#fff4f1;--ok:#3c6a56;--ok-bg:#eff7f3;--shadow:0 12px 30px rgba(24,39,48,.08)}
*{box-sizing:border-box;min-width:0}
html{overflow-x:hidden}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;line-height:1.7;-webkit-text-size-adjust:100%}
a{color:inherit}
button,input,select{font:inherit}
.topbar{position:sticky;top:0;z-index:20;background:rgba(31,52,67,.97);color:#fff;padding-top:env(safe-area-inset-top);box-shadow:0 2px 14px rgba(0,0,0,.15)}
.topbar-inner{max-width:820px;margin:auto;height:60px;padding:0 16px;display:flex;align-items:center;gap:12px}
.back-link{color:#fff;text-decoration:none;font-size:13px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.topbar-title{font-weight:900;font-size:15px;flex:1}
.layout{max-width:820px;margin:auto;padding:20px 14px 80px}
.tool-picker{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.tool-tab{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 8px;font-weight:800;color:var(--ink);cursor:pointer;font-size:13px}
.tool-tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.tool-panel{display:none}
.tool-panel.active{display:block}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 7px 22px rgba(28,42,49,.045);margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 6px}
.card h3{font-size:14px;margin:16px 0 8px;padding-left:9px;border-left:3px solid var(--gold)}
.card p.note{font-size:12px;color:var(--muted);margin:2px 0 10px}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field input,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:14px;background:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;font-size:13px;cursor:pointer}
.btn-primary{background:var(--navy);color:#fff}
.btn-outline{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn-danger-text{background:transparent;color:var(--warn);border:0;font-size:12px;padding:4px 6px;cursor:pointer}
.list{display:grid;gap:6px;margin:10px 0}
.list-row{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fafaf8;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px}
.list-row .meta{color:var(--muted)}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:999px;margin-left:4px}
.tag-shared{background:var(--gold-soft);color:#7e6234}
.tag-mine{background:var(--ok-bg);color:var(--ok)}
.slot{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:#fbfbf9}
.slot h4{margin:0 0 8px;font-size:13px;color:var(--navy2)}
.slot-result{margin-top:8px;font-size:13px;font-weight:800;padding:8px 10px;border-radius:10px}
.slot-result.hit{background:var(--ok-bg);color:var(--ok)}
.slot-result.miss{background:var(--warn-bg);color:var(--warn)}
.custom-bonus,.custom-num{margin-top:6px}
.result-box{margin-top:14px;border-radius:14px;padding:14px;font-size:14px;line-height:1.7}
.result-box.ok{background:var(--ok-bg);color:var(--ok)}
.result-box.warn{background:var(--warn-bg);color:var(--warn)}
.result-box.info{background:var(--gold-soft);color:#7e6234}
.result-box strong{font-size:16px}
.summary-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}
.summary-table th,.summary-table td{border:1px solid var(--line);padding:6px 8px;text-align:left}
.summary-table th{background:#eef1ef}
.summary-table tr.now-row td{background:var(--ok-bg);font-weight:800}
@media(max-width:480px){.row3{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar">
<div class="topbar-inner">
<a class="back-link" href="index.html">&larr; ガイドへ</a>
<div class="topbar-title">スタダ ツール集</div>
</div>
</header>
<div class="layout">

<div class="tool-picker" role="tablist">
<button aria-selected="true" class="tool-tab active" data-tool="speed" role="tab">自爆部隊速度計算機</button>
<button aria-selected="false" class="tool-tab" data-tool="tracker" role="tab">資源必要量トラッカー</button>
</div>

<!-- ===== 速度計算機 ===== -->
<div class="tool-panel active" id="panel-speed">

<div class="card">
<h2>武将データベース</h2>
<p class="note">「共通データ」はサイトに保存され、誰が見ても同じものが使えます（更新には作者への連絡、またはGitHub上でのdata/generals.csv編集が必要です）。「自分で追加」はこのブラウザだけに保存されます。凸は速度比較の際に「1凸=速度+10」として自動計算するため、ここでは登録不要です。</p>
<div class="row3">
<div class="field"><label>武将名</label><input id="genName" placeholder="例: 荒木村重" type="text"/></div>
<div class="field"><label>Lv1での速度</label><input id="genSpeed" placeholder="例: 32" type="number"/></div>
<div class="field"><label>レベルアップごとの増加値</label><input id="genIncrement" placeholder="例: 1" type="number"/></div>
</div>
<button class="btn btn-primary" id="addGeneral" type="button">自分の武将として登録</button>
<div class="list" id="generalList"></div>
</div>

<div class="card">
<h2>戦法・装備の速度ボーナス</h2>
<p class="note">ガイド内で確認済みの数値を共通データとして登録しています。必要に応じて自分用に追加できます。</p>
<div class="row2">
<div class="field"><label>名称</label><input id="tacName" placeholder="例: 百戦錬磨" type="text"/></div>
<div class="field"><label>速度ボーナス</label><input id="tacBonus" placeholder="例: 42" type="number"/></div>
</div>
<button class="btn btn-primary" id="addTactic" type="button">自分用に登録</button>
<div class="list" id="tacticList"></div>
</div>

<div class="card">
<h2>速度比較</h2>
<div class="field"><label>相手守備軍の最大速度</label><input id="enemySpeed" placeholder="例: 92" type="number"/></div>
<div id="slots"></div>
<button class="btn btn-outline" id="calcSpeed" type="button">速度を計算・比較する</button>
<div id="speedResult"></div>
</div>

</div>

<!-- ===== 資源トラッカー ===== -->
<div class="tool-panel" id="panel-tracker">

<div class="card">
<h2>資源必要量トラッカー</h2>
<p class="note">対応は天守6以降です。</p>

<h3>目標</h3>
<div class="field"><label>目標の天守レベル</label>
<select id="targetCastle">
<option value="19.2">天守6（必要 19.2万）</option>
<option value="29.2">天守7（必要 29.2万）</option>
<option value="58.4">天守8（必要 58.4万）</option>
<option value="custom">その他（手入力）</option>
</select>
<input class="custom-num" id="targetCastleCustom" placeholder="必要資源量（万）" style="display:none" type="number"/>
</div>

<h3>蔵</h3>
<div class="field"><label>蔵レベル</label>
<select id="storageCastle">
<option value="46">蔵Lv11（上限 46万）</option>
<option value="56">蔵Lv12（上限 56万）</option>
<option value="custom">その他（手入力）</option>
</select>
<input class="custom-num" id="storageCastleCustom" placeholder="蔵の上限（万）" style="display:none" type="number"/>
</div>

<h3>今の状況</h3>
<div class="row2">
<div class="field"><label>現在の貯蓄量（万）</label><input id="currentStock" placeholder="例: 10" step="0.1" type="number"/></div>
<div class="field"><label>毎時の産出量（万/時）</label><input id="hourlyRate" placeholder="例: 1.2" step="0.01" type="number"/></div>
</div>
<div class="field"><label>徴発1回で得られる資源（万）</label><input id="stonePerLevy" placeholder="例: 2.4" step="0.1" type="number"/></div>

<h3>労力</h3>
<div class="row2">
<div class="field"><label>現在の労力</label><input id="currentLabor" max="50" min="0" placeholder="0" type="number"/></div>
<div class="field"><label>現在時刻</label><input id="nowTime" type="datetime-local"/></div>
</div>
<div class="field"><label><input id="dailyLaborBuy" type="checkbox"/> 200小判で労力+20を購入する（この計算に含める）</label></div>

<button class="btn btn-primary" id="calcTracker" type="button">徴発パターンを計算する</button>
<div id="trackerResult"></div>
</div>

</div>

</div>

<script>
// ---------- storage helpers ----------
function loadJSON(key, fallback){
 try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; }
}
function saveJSON(key, val){
 try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}

// ---------- tool tab switching ----------
document.querySelectorAll('.tool-tab').forEach(btn=>btn.addEventListener('click',()=>{
 document.querySelectorAll('.tool-tab').forEach(b=>{b.classList.remove('active');b.setAttribute('aria-selected','false')});
 document.querySelectorAll('.tool-panel').forEach(p=>p.classList.remove('active'));
 btn.classList.add('active');btn.setAttribute('aria-selected','true');
 document.getElementById('panel-'+btn.dataset.tool).classList.add('active');
 try{localStorage.setItem('stada-tools-lasttab', btn.dataset.tool)}catch(e){}
}));
(function(){
 try{
  const last = localStorage.getItem('stada-tools-lasttab');
  if(last){ const b = document.querySelector('.tool-tab[data-tool="'+last+'"]'); if(b) b.click(); }
 }catch(e){}
})();

// ================= 速度計算機 =================
// 共通データ（サイトに保存・全員が使える）。data/generals.csv, data/tactics.csv を編集すると更新されます。
let BUILTIN_GENERALS = [];
let BUILTIN_TACTICS = [];

function parseCSV(text){
 const lines = text.replace(/^﻿/,'').trim().split(/\r?\n/).filter(l=>l.trim()!=='');
 if(lines.length<2) return [];
 const headers = lines[0].split(',').map(h=>h.trim());
 return lines.slice(1).map(line=>{
  const cells = line.split(',').map(c=>c.trim());
  const obj = {};
  headers.forEach((h,i)=>{ obj[h] = cells[i]!==undefined ? cells[i] : ''; });
  return obj;
 });
}
async function loadBuiltinData(){
 try{
  const res = await fetch('data/generals.csv');
  const rows = parseCSV(await res.text());
  BUILTIN_GENERALS = rows.filter(r=>r.name).map(r=>({
   name:r.name, lv1Speed:Number(r.lv1Speed||0), increment:Number(r.increment||0)
  }));
 }catch(e){ BUILTIN_GENERALS = []; }
 try{
  const res = await fetch('data/tactics.csv');
  const rows = parseCSV(await res.text());
  BUILTIN_TACTICS = rows.filter(r=>r.name).map(r=>({ name:r.name, bonus:Number(r.bonus||0) }));
 }catch(e){ BUILTIN_TACTICS = []; }
 renderGeneralList(); renderTacticList(); renderSlots();
}

const GEN_KEY='stada-tools-generals-v3', TAC_KEY='stada-tools-tactics-v2';
let myGenerals = loadJSON(GEN_KEY, []);
let myTactics = loadJSON(TAC_KEY, []);
function uid(){ return 'id'+Date.now()+Math.floor(Math.random()*1000); }

const DUPE_SPEED_BONUS = 10; // 凸1につき速度+10（全ポイントを速度に振った想定）

function allGenerals(){
 const builtin = BUILTIN_GENERALS.map((g,i)=>({id:'builtin-'+i, name:g.name, lv1Speed:g.lv1Speed, increment:g.increment||0, shared:true}));
 return builtin.concat(myGenerals.map(g=>Object.assign({shared:false}, g)));
}
function allTactics(){
 const builtin = BUILTIN_TACTICS.map((t,i)=>({id:'builtin-'+i, name:t.name, bonus:t.bonus, shared:true}));
 return builtin.concat(myTactics.map(t=>Object.assign({shared:false}, t)));
}
function computeSpeed(gen, targetLevel, dupe){
 return gen.lv1Speed + (targetLevel - 1) * (gen.increment || 0) + (dupe||0) * DUPE_SPEED_BONUS;
}

function renderGeneralList(){
 const el = document.getElementById('generalList');
 el.innerHTML = '';
 allGenerals().forEach(g=>{
  const row = document.createElement('div'); row.className='list-row';
  const tag = g.shared ? '<span class="tag tag-shared">共通</span>' : '<span class="tag tag-mine">自分</span>';
  row.innerHTML = '<span>'+g.name+tag+' <span class="meta">(Lv1速度'+g.lv1Speed+' / 上昇値+'+(g.increment||0)+'per Lv)</span></span>';
  if(!g.shared){
   const del = document.createElement('button'); del.className='btn-danger-text'; del.textContent='削除';
   del.addEventListener('click',()=>{ myGenerals = myGenerals.filter(x=>x.id!==g.id); saveJSON(GEN_KEY, myGenerals); renderGeneralList(); renderSlots(); });
   row.appendChild(del);
  }
  el.appendChild(row);
 });
}
function renderTacticList(){
 const el = document.getElementById('tacticList');
 el.innerHTML = '';
 allTactics().forEach(t=>{
  const row = document.createElement('div'); row.className='list-row';
  const tag = t.shared ? '<span class="tag tag-shared">共通</span>' : '<span class="tag tag-mine">自分</span>';
  row.innerHTML = '<span>'+t.name+tag+' <span class="meta">(+'+t.bonus+')</span></span>';
  if(!t.shared){
   const del = document.createElement('button'); del.className='btn-danger-text'; del.textContent='削除';
   del.addEventListener('click',()=>{ myTactics = myTactics.filter(x=>x.id!==t.id); saveJSON(TAC_KEY, myTactics); renderTacticList(); renderSlots(); });
   row.appendChild(del);
  }
  el.appendChild(row);
 });
}

document.getElementById('addGeneral').addEventListener('click',()=>{
 const name = document.getElementById('genName').value.trim();
 const speed = document.getElementById('genSpeed').value;
 const increment = Number(document.getElementById('genIncrement').value || 0);
 if(!name || speed===''){ alert('武将名とLv1での速度は必須です'); return; }
 myGenerals.push({id:uid(), name, lv1Speed:Number(speed), increment});
 saveJSON(GEN_KEY, myGenerals);
 document.getElementById('genName').value='';document.getElementById('genSpeed').value='';document.getElementById('genIncrement').value='';
 renderGeneralList(); renderSlots();
});
document.getElementById('addTactic').addEventListener('click',()=>{
 const name = document.getElementById('tacName').value.trim();
 const bonus = document.getElementById('tacBonus').value;
 if(!name || bonus===''){ alert('名称とボーナス値は必須です'); return; }
 myTactics.push({id:uid(), name, bonus:Number(bonus)});
 saveJSON(TAC_KEY, myTactics);
 document.getElementById('tacName').value='';document.getElementById('tacBonus').value='';
 renderTacticList(); renderSlots();
});

function bonusSelectHTML(prefix){
 let opts = '<option value="">なし</option>';
 allTactics().forEach(t=>{ opts += '<option value="'+t.id+'">'+t.name+' (+'+t.bonus+')</option>'; });
 opts += '<option value="custom">カスタム入力…</option>';
 return '<select class="bonusSelect" data-slotprefix="'+prefix+'">'+opts+'</select><input class="custom-bonus" data-slotprefix="'+prefix+'" placeholder="速度ボーナス" style="display:none" type="number"/>';
}
function levelSelectHTML(prefix, defaultLevel){
 const opts = [7,8,9];
 let html = '<select class="levelSelect" data-slotprefix="'+prefix+'">';
 opts.forEach(l=>{ html += '<option value="'+l+'"'+(l===defaultLevel?' selected':'')+'>Lv'+l+'</option>'; });
 html += '<option value="custom"'+(opts.indexOf(defaultLevel)===-1?' selected':'')+'>カスタム…</option></select>';
 html += '<input class="custom-num levelCustom" data-slotprefix="'+prefix+'" placeholder="レベル" style="display:'+(opts.indexOf(defaultLevel)===-1?'block':'none')+'" type="number" value="'+(opts.indexOf(defaultLevel)===-1?defaultLevel:'')+'"/>';
 return html;
}
function dupeSelectHTML(prefix){
 let html = '<select class="dupeSelect" data-slotprefix="'+prefix+'">';
 for(let d=0; d<=5; d++){ html += '<option value="'+d+'"'+(d===0?' selected':'')+'>'+d+'凸</option>'; }
 html += '</select>';
 return html;
}
function renderSlots(){
 const wrap = document.getElementById('slots');
 wrap.innerHTML = '';
 const labels = ['大将','副将1','副将2'];
 const gens = allGenerals();
 labels.forEach((label,i)=>{
  const slot = document.createElement('div'); slot.className='slot'; slot.dataset.slot=i;
  let genOpts = '<option value="">武将を選択</option>';
  gens.forEach(g=>{ genOpts += '<option value="'+g.id+'">'+g.name+'（Lv1速度'+g.lv1Speed+(g.increment?' / +'+g.increment+'per Lv':'')+'）'+(g.shared?'':' [自分]')+'</option>'; });
  slot.innerHTML =
   '<h4>'+label+'</h4>'+
   '<div class="field"><select class="genSelect">'+genOpts+'</select></div>'+
   '<div class="row2"><div class="field"><label style="margin:0 0 4px">計算するレベル</label>'+levelSelectHTML(i+'-lv', 7)+'</div>'+
   '<div class="field"><label style="margin:0 0 4px">凸</label>'+dupeSelectHTML(i+'-dupe')+'</div></div>'+
   '<div class="field">'+bonusSelectHTML(i+'-1')+'</div>'+
   '<div class="field">'+bonusSelectHTML(i+'-2')+'</div>'+
   '<div class="field">'+bonusSelectHTML(i+'-3')+'</div>'+
   '<div class="slot-result" style="display:none"></div>';
  wrap.appendChild(slot);
 });
 wrap.querySelectorAll('.bonusSelect').forEach(sel=>{
  sel.addEventListener('change',()=>{
   const input = wrap.querySelector('.custom-bonus[data-slotprefix="'+sel.dataset.slotprefix+'"]');
   input.style.display = sel.value==='custom' ? 'block' : 'none';
  });
 });
 wrap.querySelectorAll('.levelSelect').forEach(sel=>{
  sel.addEventListener('change',()=>{
   const input = wrap.querySelector('.levelCustom[data-slotprefix="'+sel.dataset.slotprefix+'"]');
   input.style.display = sel.value==='custom' ? 'block' : 'none';
  });
  sel.addEventListener('change',()=>{
   const genSel = sel.closest('.slot').querySelector('.genSelect');
   const gen = gens.find(g=>g.id===genSel.value);
   if(gen && sel.value!=='custom'){
    // default the custom box to a sensible starting value if switched later
   }
  });
 });
}
document.getElementById('calcSpeed').addEventListener('click',()=>{
 const enemy = Number(document.getElementById('enemySpeed').value || 0);
 const gens = allGenerals();
 const tactics = allTactics();
 const results = [];
 document.querySelectorAll('#slots .slot').forEach(slot=>{
  const genId = slot.querySelector('.genSelect').value;
  const gen = gens.find(g=>g.id===genId);
  const resultEl = slot.querySelector('.slot-result');
  if(!gen){ resultEl.style.display='none'; return; }
  const levelSel = slot.querySelector('.levelSelect');
  let targetLevel = 7;
  if(levelSel.value==='custom'){
   const custom = slot.querySelector('.levelCustom').value;
   if(custom!=='') targetLevel = Number(custom);
  }else{
   targetLevel = Number(levelSel.value);
  }
  const dupe = Number(slot.querySelector('.dupeSelect').value || 0);
  let total = computeSpeed(gen, targetLevel, dupe);
  slot.querySelectorAll('.bonusSelect').forEach(sel=>{
   if(sel.value==='custom'){
    const input = slot.querySelector('.custom-bonus[data-slotprefix="'+sel.dataset.slotprefix+'"]');
    total += Number(input.value || 0);
   }else if(sel.value){
    const t = tactics.find(x=>x.id===sel.value);
    if(t) total += t.bonus;
   }
  });
  const hit = total > enemy;
  resultEl.style.display='block';
  resultEl.className = 'slot-result ' + (hit ? 'hit' : 'miss');
  resultEl.textContent = gen.name+'（Lv'+targetLevel+' / '+dupe+'凸）：合計速度 '+total+'　'+(hit ? '✓ 先手を取れます' : '✗ 先手を取れません')+'（差: '+(total-enemy)+'）';
  results.push({name:gen.name+'（Lv'+targetLevel+' / '+dupe+'凸）', total, hit});
 });
 const box = document.getElementById('speedResult');
 if(results.length===0){ box.innerHTML = '<div class="result-box warn">武将を1体以上選んでください。</div>'; return; }
 results.sort((a,b)=>b.total-a.total);
 let html = '<div class="result-box '+(results.some(r=>r.hit)?'ok':'warn')+'"><strong>比較結果（速度が速い順）</strong><table class="summary-table"><tr><th>武将</th><th>合計速度</th><th>先手</th></tr>';
 results.forEach(r=>{ html += '<tr><td>'+r.name+'</td><td>'+r.total+'</td><td>'+(r.hit?'○':'×')+'</td></tr>'; });
 html += '</table></div>';
 box.innerHTML = html;
});

renderGeneralList();
renderTacticList();
renderSlots();
loadBuiltinData();

// ================= 資源トラッカー =================
(function(){
 const now = new Date();
 now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
 document.getElementById('nowTime').value = now.toISOString().slice(0,16);
})();
['targetCastle','storageCastle'].forEach(id=>{
 document.getElementById(id).addEventListener('change',(e)=>{
  document.getElementById(id+'Custom').style.display = e.target.value==='custom' ? 'block' : 'none';
 });
});

const LABOR_PER_LEVY = 6; // 徴発1回の労力コスト（固定）
const LABOR_CAP = 50;
const DAILY_LABOR_BUY_AMOUNT = 20; // 200小判で1日1回、+20

function fmtDate(d){
 return (d.getMonth()+1)+'月'+d.getDate()+'日 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

document.getElementById('calcTracker').addEventListener('click',()=>{
 const targetSel = document.getElementById('targetCastle').value;
 const targetNeed = targetSel==='custom' ? Number(document.getElementById('targetCastleCustom').value||0) : Number(targetSel);
 const capSel = document.getElementById('storageCastle').value;
 const storageCap = capSel==='custom' ? Number(document.getElementById('storageCastleCustom').value||0) : Number(capSel);
 const currentStock = Number(document.getElementById('currentStock').value || 0);
 const hourlyRate = Number(document.getElementById('hourlyRate').value || 0);
 const stonePerLevy = Number(document.getElementById('stonePerLevy').value || 0);
 const currentLabor = Number(document.getElementById('currentLabor').value || 0);
 const dailyLaborBuy = document.getElementById('dailyLaborBuy').checked;
 const nowVal = document.getElementById('nowTime').value;
 const box = document.getElementById('trackerResult');

 if(targetNeed<=0){ box.innerHTML = '<div class="result-box warn">目標の天守レベルを選んでください。</div>'; return; }
 const now = nowVal ? new Date(nowVal) : new Date();

 if(storageCap>0 && targetNeed > storageCap){
  const gap = (targetNeed - storageCap).toFixed(2);
  box.innerHTML = '<div class="result-box warn"><strong>徴発だけでは目標に届きません</strong><br/>'
   +'目標（'+targetNeed+'万）が蔵の上限（'+storageCap+'万）を超えています。<br/>'
   +'残り <strong>'+gap+'万</strong> は、評定報酬や任務報酬など「上限を超えて受け取れる」報酬で上乗せする必要があります。</div>';
  return;
 }

 const availableLabor = currentLabor + (dailyLaborBuy ? DAILY_LABOR_BUY_AMOUNT : 0);
 const maxLevies = stonePerLevy>0 ? Math.floor(availableLabor / LABOR_PER_LEVY) : 0;

 let rows = '';
 for(let n=0; n<=maxLevies; n++){
  const boost = n * stonePerLevy;
  let stock = currentStock + boost;
  if(storageCap>0) stock = Math.min(stock, storageCap);
  let etaText;
  if(stock >= targetNeed){
   etaText = '今すぐ到達可能';
  }else if(hourlyRate<=0){
   etaText = '毎時産出量を入力してください';
  }else{
   const remaining = targetNeed - stock;
   const hours = remaining / hourlyRate;
   const eta = new Date(now.getTime() + hours*3600*1000);
   etaText = fmtDate(eta)+'ごろ';
  }
  const laborUsed = n*LABOR_PER_LEVY;
  rows += '<tr><td>'+n+'回（労力'+laborUsed+'）</td><td>'+etaText+'</td></tr>';
 }
 if(maxLevies===0 && stonePerLevy<=0){
  rows = '<tr><td colspan="2">「徴発1回で得られる資源」を入力すると、徴発回数ごとの比較が表示されます。</td></tr>';
 }

 box.innerHTML = '<div class="result-box info"><strong>徴発回数ごとの到達時刻</strong>'
  +'（現在の貯蓄'+currentStock+'万、利用可能な労力'+availableLabor+(dailyLaborBuy?'（購入込み）':'')+'）'
  +'<table class="summary-table"><tr><th>徴発回数</th><th>到達時刻</th></tr>'+rows+'</table></div>';
});
</script>
</body>
</html>
